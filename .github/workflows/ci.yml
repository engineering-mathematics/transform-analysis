name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: upstream breakage, new advisories

permissions:
  contents: read

jobs:
  ci:
    uses: engineering-mathematics/.github/.github/workflows/python-ci.yml@main
    with:
      # Infrastructure packages are git sources until published; drop both lines then.
      clean-env-from-lock: true
      export-args: --no-emit-package engg-math-core --no-emit-package engg-math-units
  security:
    uses: engineering-mathematics/.github/.github/workflows/python-security.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
